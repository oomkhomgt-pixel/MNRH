<!-- ต้นไม้ของกลุ่มงานออร์โธปิดิกส์ รพ.มหาราชนครราชสีมา — ฉบับสำหรับใช้เป็นไอคอนแอป
     สีตาม CI ทุกจุด: ส้ม #F5901A บนพื้นขาว ไม่มีสีอื่นเพิ่ม
     ต่างจากโลโก้บนหัวจดหมายอย่างเดียวคือ "วงกลมทึบแทนวงแหวน" — วงแหวนบางเกินไป
     พอย่อเหลือ 48px บนหน้าจอโฮมแล้วรูตรงกลางตัน กลายเป็นก้อนเบลอ
     (โลโก้ฉบับวงแหวนยังเป็นตัวจริงสำหรับเอกสารและงานพิมพ์ทุกชิ้น)
     ไฟล์ PNG ทั้งสี่ใบในโฟลเดอร์นี้เรนเดอร์จากไฟล์นี้ — แก้ที่นี่แล้วเรนเดอร์ใหม่ -->

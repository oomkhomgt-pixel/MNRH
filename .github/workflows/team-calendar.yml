# ปฏิทินทีมออร์โธ (ทีมฟ้า) — ดู team-calendar/README.md
#
# งานสองอย่างในไฟล์เดียว:
#   1. build  — ทุกครั้งที่แก้ team-calendar/schedule.json (แก้บนหน้าเว็บ GitHub ได้เลย) จะตรวจไฟล์ สร้างไฟล์ปฏิทิน .ics ใหม่
#               แล้ว commit กลับเข้า branch เดิมให้เอง — ผู้ประสานงานไม่ต้องติดตั้งอะไรในเครื่อง
#   2. notify — ส่งสรุปงานของแต่ละคนเข้ากลุ่ม LINE วันละสองรอบ: 06:45 (งานวันนี้) และ 18:45 (งานพรุ่งนี้) เวลาไทย
#               ตารางเวลา (schedule) ของ GitHub ทำงานเฉพาะบน branch หลัก (main) เท่านั้น
name: ปฏิทินทีมออร์โธ

on:
  push:
    paths:
      - "team-calendar/schedule.json"
      - "team-calendar/*.mjs"
  schedule:
    # ไทยเป็น UTC+7 ตลอดปี: 23:45 UTC = 06:45 น. · 11:45 UTC = 18:45 น.
    # ไม่ใช้นาทีที่ 0 เพราะ GitHub มักเลื่อนรอบตรงชั่วโมงออกไป 10–30 นาทีช่วงคนใช้เยอะ
    - cron: "45 23 * * *"
    - cron: "45 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "ส่งของวันไหน"
        type: choice
        options: [auto, today, tomorrow]
        default: auto
      date:
        description: "ระบุวันที่เอง YYYY-MM-DD (เว้นว่าง = ตาม mode)"
        type: string
        default: ""
      dry_run:
        description: "โหมดทดสอบ — ไม่ส่งเข้า LINE จริง แค่แสดงข้อความใน log"
        type: boolean
        default: true

jobs:
  build:
    if: github.event_name == 'push'
    name: ตรวจ schedule.json · สร้างไฟล์ปฏิทิน
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: team-calendar-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ตรวจและสร้างไฟล์ปฏิทิน
        run: node team-calendar/build.mjs
      - name: รันชุดทดสอบ
        run: node --test team-calendar/test.mjs
      # push ด้วย GITHUB_TOKEN ไม่ปลุก workflow รอบใหม่ จึงไม่วนซ้ำไม่จบ
      - name: commit ไฟล์ปฏิทินที่เปลี่ยน
        run: |
          if git diff --quiet -- team-calendar/feeds && [ -z "$(git ls-files --others --exclude-standard team-calendar/feeds)" ]; then
            echo "ไฟล์ปฏิทินไม่เปลี่ยน"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A team-calendar/feeds
          git commit -m "ปฏิทินทีม: สร้างไฟล์ .ics ใหม่จาก schedule.json"
          git push

  notify:
    if: github.event_name != 'push'
    name: ส่งงานของแต่ละคนเข้ากลุ่ม LINE
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: team-calendar-notify
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: รันชุดทดสอบ
        run: node --test team-calendar/test.mjs
      - name: ส่ง
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          TEAM_LINE_GROUP_ID: ${{ secrets.TEAM_LINE_GROUP_ID }}
          TEAM_LINE_USER_IDS: ${{ secrets.TEAM_LINE_USER_IDS }}
          # inputs มีเฉพาะตอนสั่งเอง — รอบตามตารางเวลาเป็นค่าว่าง จึงได้ mode=auto และส่งจริง
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          DATE: ${{ github.event.inputs.date }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS="--mode=$MODE"
          [ -n "$DATE" ] && ARGS="$ARGS --date=$DATE"
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            echo "สั่งทดสอบ (dry-run) — ไม่ส่งเข้า LINE จริง"
            ARGS="$ARGS --dry-run"
          elif [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ] || [ -z "$TEAM_LINE_GROUP_ID" ]; then
            # ยังไม่ได้ตั้งค่า LINE — ไม่ทำให้รอบตามตารางเวลาแดงทุกวัน แค่แสดงข้อความตัวอย่าง
            echo "::notice::ยังไม่ได้ตั้ง LINE_CHANNEL_ACCESS_TOKEN / TEAM_LINE_GROUP_ID ใน GitHub Secrets — แสดงข้อความตัวอย่างแทน (ดู team-calendar/README.md)"
            ARGS="$ARGS --dry-run"
          fi
          node team-calendar/notify.mjs $ARGS

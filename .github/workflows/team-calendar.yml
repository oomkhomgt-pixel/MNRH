# ปฏิทินอาจารย์ออร์โธปิดิกส์สายฟ้า — ดู team-calendar/README.md
#
# งานเดียวที่ทำอัตโนมัติ: ทุกครั้งที่แก้ team-calendar/schedule.json (แก้บนหน้าเว็บ GitHub ได้เลย)
# จะตรวจไฟล์ สร้างไฟล์ปฏิทิน .ics ใหม่ แล้ว commit กลับเข้า branch เดิมให้เอง
#
# ★ ไม่ผูกกับระบบอื่นของแผนก — ไม่ใช้ secret ร่วม ไม่แตะไฟล์นอก team-calendar/
# ★ การแจ้งเตือน LINE ปิดไว้ก่อน: ไม่มีตารางเวลา (schedule) ส่งอัตโนมัติ เหลือเฉพาะปุ่มสั่งเองเพื่อทดสอบข้อความ
name: ปฏิทินอาจารย์สายฟ้า

on:
  push:
    paths:
      - "team-calendar/schedule.json"
      - "team-calendar/*.mjs"
  workflow_dispatch:
    inputs:
      mode:
        description: "ทดสอบข้อความ LINE ของวันไหน"
        type: choice
        options: [auto, today, tomorrow]
        default: auto
      date:
        description: "ระบุวันที่เอง YYYY-MM-DD (เว้นว่าง = ตาม mode)"
        type: string
        default: ""
      dry_run:
        description: "โหมดทดสอบ — ไม่ส่งเข้า LINE จริง แค่แสดงข้อความใน log"
        type: boolean
        default: true

jobs:
  build:
    if: github.event_name == 'push'
    name: ตรวจ schedule.json · สร้างไฟล์ปฏิทิน
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: team-calendar-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ตรวจและสร้างไฟล์ปฏิทิน
        run: node team-calendar/build.mjs
      - name: รันชุดทดสอบ
        run: node --test team-calendar/test.mjs
      # push ด้วย GITHUB_TOKEN ไม่ปลุก workflow รอบใหม่ จึงไม่วนซ้ำไม่จบ
      - name: commit ไฟล์ปฏิทินที่เปลี่ยน
        run: |
          if git diff --quiet -- team-calendar/feeds && [ -z "$(git ls-files --others --exclude-standard team-calendar/feeds)" ]; then
            echo "ไฟล์ปฏิทินไม่เปลี่ยน"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A team-calendar/feeds
          git commit -m "ปฏิทินทีม: สร้างไฟล์ .ics ใหม่จาก schedule.json"
          git push

  notify:
    if: github.event_name != 'push'
    name: ทดสอบข้อความ LINE (สั่งเองเท่านั้น)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: team-calendar-notify
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: รันชุดทดสอบ
        run: node --test team-calendar/test.mjs
      - name: ส่ง
        env:
          TEAM_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.TEAM_LINE_CHANNEL_ACCESS_TOKEN }}
          TEAM_LINE_GROUP_ID: ${{ secrets.TEAM_LINE_GROUP_ID }}
          TEAM_LINE_USER_IDS: ${{ secrets.TEAM_LINE_USER_IDS }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          DATE: ${{ github.event.inputs.date }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS="--mode=$MODE"
          [ -n "$DATE" ] && ARGS="$ARGS --date=$DATE"
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            echo "สั่งทดสอบ (dry-run) — ไม่ส่งเข้า LINE จริง"
            ARGS="$ARGS --dry-run"
          elif [ -z "$TEAM_LINE_CHANNEL_ACCESS_TOKEN" ] || [ -z "$TEAM_LINE_GROUP_ID" ]; then
            echo "::notice::ยังไม่ได้ตั้ง TEAM_LINE_CHANNEL_ACCESS_TOKEN / TEAM_LINE_GROUP_ID ใน GitHub Secrets — แสดงข้อความตัวอย่างแทน"
            ARGS="$ARGS --dry-run"
          fi
          node team-calendar/notify.mjs $ARGS

# Corridor Finder checks — engine unit tests (pytest), including the golden tests that run the
# viewer's screw check (viewer/clearance.js) under Node against validate.py. The viewer's
# rendering has no browser test yet (see corridor-finder/README.md, Status).
#
# workflow_dispatch only for now, matching portfolio.yml, while the project is still under
# active development. Enable push/pull_request triggers once the engine has stabilized.
name: ตรวจ Corridor Finder

on:
  workflow_dispatch:

concurrency:
  group: corridor-finder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ชุดทดสอบ corridor_engine (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: corridor-finder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: corridor-finder/requirements-dev.txt

      # `node` on the PATH for tests/python/test_viewer_clearance_golden.py, pinned here rather
      # than taken from whatever the runner image ships. No npm packages, so no npm cache.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ติดตั้ง dependencies
        run: pip install -r requirements-dev.txt -e .
        timeout-minutes: 5

      # CF_REQUIRE_NODE=1 makes the golden tests fail, instead of skip, if `node` is missing.
      # -ra ends the log with every failed and skipped test, skips with their reason (-rs
      # alone would drop the failures from that list).
      - name: รัน pytest
        run: pytest -q -ra
        env:
          CF_REQUIRE_NODE: "1"
